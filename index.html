<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ბარკოდის სკანერი</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #1a1a2e);
            color: var(--tg-theme-text-color, #eee);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 12px 16px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            background: var(--tg-theme-secondary-bg-color, #16213e);
        }
        #reader {
            width: 100%;
            max-width: 500px;
            max-height: 35vh;
            margin: 0 auto;
            overflow: hidden;
        }
        #reader video {
            border-radius: 8px;
            max-height: 35vh;
            object-fit: cover;
        }
        /* Native კამერის კონტეინერი */
        #nativeCamera {
            width: 100%;
            max-width: 500px;
            max-height: 35vh;
            margin: 0 auto;
            position: relative;
            display: none;
            overflow: hidden;
        }
        #nativeCamera video {
            width: 100%;
            max-height: 35vh;
            object-fit: cover;
            border-radius: 8px;
        }
        #nativeCamera canvas {
            display: none;
        }
        .scan-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 280px;
            height: 150px;
            border: 2px solid rgba(46, 204, 113, 0.7);
            border-radius: 8px;
            pointer-events: none;
        }
        .scan-overlay.detecting {
            border-color: #f39c12;
            animation: pulse 0.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .scan-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px 16px;
        }
        .scan-btn {
            padding: 14px 32px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            background: #2ecc71;
            color: #fff;
            min-width: 160px;
        }
        .scan-btn.scanning {
            background: #e74c3c;
        }
        .scan-btn.paused {
            background: #f39c12;
        }
        .scan-btn:active { opacity: 0.7; }
        .scan-btn:disabled { opacity: 0.4; }
        .torch-btn {
            padding: 14px 18px;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
            background: var(--tg-theme-secondary-bg-color, #16213e);
            color: var(--tg-theme-text-color, #eee);
            border: 1px solid var(--tg-theme-hint-color, #555);
            display: none;
        }
        .torch-btn.active {
            background: #f39c12;
            color: #000;
            border-color: #f39c12;
        }
        .torch-btn:active { opacity: 0.7; }
        .scan-list {
            flex: 1;
            padding: 8px 16px;
            overflow-y: auto;
            max-height: 40vh;
        }
        .scan-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--tg-theme-secondary-bg-color, #16213e);
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 8px;
            animation: fadeIn 0.3s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; } }
        .scan-item .code {
            font-size: 15px;
            font-weight: 500;
            flex: 1;
            word-break: break-all;
        }
        .scan-item .qty-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: 10px;
        }
        .qty-btn {
            width: 32px; height: 32px;
            border-radius: 50%;
            border: none;
            background: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #fff);
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .qty-btn:active { opacity: 0.7; }
        .qty-num {
            font-size: 16px;
            font-weight: 600;
            min-width: 20px;
            text-align: center;
        }
        .remove-btn {
            width: 28px; height: 28px;
            border-radius: 50%;
            border: none;
            background: #e74c3c;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            margin-left: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .bottom-bar {
            padding: 10px 16px 20px;
            display: flex;
            gap: 10px;
        }
        .btn {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-send {
            background: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #fff);
        }
        .btn-clear {
            background: var(--tg-theme-secondary-bg-color, #16213e);
            color: var(--tg-theme-text-color, #eee);
            border: 1px solid var(--tg-theme-hint-color, #555);
        }
        .btn:disabled { opacity: 0.4; }
        .btn:active:not(:disabled) { opacity: 0.7; }
        .empty-msg {
            text-align: center;
            color: var(--tg-theme-hint-color, #888);
            padding: 30px 16px;
            font-size: 14px;
        }
        .total-bar {
            text-align: center;
            padding: 6px;
            font-size: 14px;
            color: var(--tg-theme-hint-color, #aaa);
        }
        .status-msg {
            text-align: center;
            padding: 10px;
            font-size: 14px;
            font-weight: 500;
        }
        .status-ok { color: #2ecc71; }
        .status-err { color: #e74c3c; }
        .last-scan {
            text-align: center;
            padding: 4px;
            font-size: 12px;
            color: #2ecc71;
        }
        .confidence-bar {
            text-align: center;
            padding: 2px;
            font-size: 11px;
            color: var(--tg-theme-hint-color, #888);
        }
        /* ხელით შეყვანის ველი */
        .manual-input-bar {
            display: flex;
            gap: 8px;
            padding: 8px 16px;
        }
        .manual-input-bar input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid var(--tg-theme-hint-color, #555);
            background: var(--tg-theme-secondary-bg-color, #16213e);
            color: var(--tg-theme-text-color, #eee);
            font-size: 15px;
        }
        .manual-input-bar button {
            padding: 10px 16px;
            border-radius: 10px;
            border: none;
            background: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #fff);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        #rcvResume {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: var(--tg-theme-bg-color, #1a1a2e);
            color: var(--tg-theme-text-color, #eee);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 24px;
            text-align: center;
        }
        #rcvResume .rcv-count { font-size: 20px; font-weight: 700; }
        #rcvResume .rcv-msg { font-size: 15px; color: #ff8a80; }
        #rcvResume button {
            padding: 22px 40px;
            border-radius: 16px;
            border: none;
            background: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #fff);
            font-size: 22px;
            font-weight: 700;
        }
        .engine-badge {
            text-align: center;
            padding: 2px 8px;
            font-size: 10px;
            color: var(--tg-theme-hint-color, #666);
        }
        /* მიღება k-ით: მრიცხველები და ბოტის სტატუსი */
        #rcvCounters { display: none; padding: 4px 16px 0; text-align: center; }
        #rcvCounters .rcv-saved { font-size: 26px; font-weight: 800; color: #2ecc71; }
        #rcvCounters .rcv-unsent {
            margin-top: 6px; padding: 8px; border-radius: 10px;
            background: #f1c40f; color: #000; font-size: 16px; font-weight: 700;
        }
        #rcvCounters .rcv-closed {
            margin-top: 6px; padding: 8px; border-radius: 10px;
            background: #e74c3c; color: #fff; font-size: 15px; font-weight: 700;
        }
        .rcv-h { font-size: 13px; color: var(--tg-theme-hint-color, #aaa); margin: 6px 0; }
        .rcv-mark { margin-right: 8px; }
        .rcv-total { display: flex; justify-content: space-between; gap: 10px; padding: 4px 14px; font-size: 14px; word-break: break-all; }
    </style>
</head>
<body>
    <div class="header" id="headerText">📷 ბარკოდის სკანერი</div>
    <!-- Native BarcodeDetector camera -->
    <div id="nativeCamera">
        <video id="nativeVideo" autoplay playsinline muted></video>
        <canvas id="nativeCanvas"></canvas>
        <div class="scan-overlay" id="scanOverlay"></div>
    </div>
    <!-- html5-qrcode fallback -->
    <div id="reader"></div>
    <div class="last-scan" id="lastScan"></div>
    <div class="confidence-bar" id="confidenceBar"></div>
    <div class="engine-badge" id="engineBadge"></div>
    <div class="scan-controls">
        <button class="scan-btn" id="scanBtn" onclick="toggleScanner()">📸 სკანირება</button>
        <button class="torch-btn" id="torchBtn" onclick="toggleTorch()">🔦</button>
    </div>
    <!-- ხელით შეყვანის ველი -->
    <div class="manual-input-bar">
        <input type="text" id="manualCode" placeholder="კოდი ხელით..." autocomplete="off" />
        <button onclick="addManualCode()">➕</button>
    </div>
    <div id="rcvCounters"></div>
    <div class="scan-list" id="scanList">
        <div class="empty-msg">📸 დააჭირე სკანირებას ან ხელით შეიყვანე კოდი</div>
    </div>
    <div class="total-bar" id="totalBar"></div>
    <div id="statusMsg"></div>
    <!-- მიღების რეჟიმი: ზარის / აპის გადართვის შემდეგ კამერის ხელით ჩართვა -->
    <div id="rcvResume">
        <div class="rcv-count" id="rcvResumeCount"></div>
        <button id="rcvResumeBtn" type="button">📷 კამერის ჩართვა</button>
        <div class="rcv-msg" id="rcvResumeMsg"></div>
    </div>
    <div class="bottom-bar">
        <button class="btn btn-clear" id="clearBtn" onclick="clearAll()">🗑 გასუფთავება</button>
        <button class="btn btn-send" id="sendBtn" onclick="sendData()" disabled>✅ დასრულება</button>
    </div>

    <script src="rcv-outbox.js?v=3"></script>
    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Cloudflare Worker relay URL
        const WORKER_URL = 'https://scanner-relay.office-adtec.workers.dev';
        const BOT_NAME = 'adtwarehousebot';

        // ოპერაციის კონტექსტის წაკითხვა
        let opType = '';
        let buyerId = '0';

        const startParam = (tg.initDataUnsafe && tg.initDataUnsafe.start_param) || '';
        if (startParam) {
            const idx = startParam.indexOf('_');
            if (idx > 0) {
                opType = startParam.substring(0, idx);
                buyerId = startParam.substring(idx + 1) || '0';
            } else {
                opType = startParam;
            }
        }
        if (!opType) {
            const urlParams = new URLSearchParams(window.location.search);
            // web_app= ღილაკით URL-ში ?startapp=SALE_235 ფორმატით მოდის
            const urlStartApp = urlParams.get('startapp') || '';
            if (urlStartApp) {
                const idx2 = urlStartApp.indexOf('_');
                if (idx2 > 0) {
                    opType = urlStartApp.substring(0, idx2);
                    buyerId = urlStartApp.substring(idx2 + 1) || '0';
                } else {
                    opType = urlStartApp;
                }
            } else {
                opType = urlParams.get('op') || '';
                buyerId = urlParams.get('bid') || '0';
            }
        }

        const headerEl = document.getElementById('headerText');
        if (opType === 'SALE') {
            headerEl.textContent = '📷 სკანერი — 📤 გასაწერი';
        } else if (opType === 'WRITEOFF') {
            headerEl.textContent = '📷 სკანერი — 📥 ჩამოსაწერი';
        } else if (opType === 'PURCHASE') {
            headerEl.textContent = '📷 სკანერი — 📦 შეძენა';
        }

        // ===== მიღების რეჟიმი: სკანი ჯერ ტელეფონში ინახება (outbox), მერე სიგნალი =====
        const RID = new URLSearchParams(window.location.search).get('rid');
        const RCV_K = new URLSearchParams(window.location.search).get('k');
        const RCV_UID = tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id;
        const RCV_MODE = opType === 'PURCHASE' && !!RID && !!RCV_UID;
        // k (წევრის გასაღები ბოტიდან) → სკანი მაშინვე Worker-ზე, „✅ დასრულების" გარეშე.
        // k-ს გარეშე (ბოტს საიდუმლო არ აქვს / ძველი ღილაკი) — ფაზა A: ტელეფონში + ძველი გაგზავნა.
        const RCV_LIVE = RCV_MODE && !!RCV_K;
        let outbox = null;
        let rcvSending = false;  // გაგზავნისას სკანი/გაუქმება იკრძალება
        let rcvRows = [];        // ბოლოს დარენდერებული სტრიქონები („+" ინდექსით, inline JS-ის გარეშე)
        let rcvStatus = null;    // ბოტის ბოლო სტატუსი Worker-იდან (null — ჯერ არ მოსულა / 404)
        let rcvClosed = false;   // ბოტმა მიღება დახურა — აღარც გაგზავნა, აღარც სკანირება
        let rcvTimer = null;     // გაგზავნის ტაიმერი (debounce ან ხელახალი ცდა)
        let rcvFirstChange = 0;  // პირველი გაუგზავნელი ცვლილების დრო (max-wait)
        let rcvBackoff = 0;      // ბოლო ხელახალი ცდის პაუზა; 0 — ჩავარდნა არ ყოფილა
        let rcvFlushing = false;
        let rcvPolling = false;
        let rcvPollTimer = null;
        function rcvRand(n) {
            const b = new Uint8Array(Math.ceil(n / 2));
            crypto.getRandomValues(b);
            return Array.from(b, x => x.toString(16).padStart(2, '0')).join('').slice(0, n);
        }
        if (RCV_MODE) {
            outbox = RcvOutbox.open({
                storage: window.localStorage,
                rid: RID,
                uid: RCV_UID,
                k: RCV_K,
                now: Date.now,
                rand: rcvRand
            });
            document.getElementById('clearBtn').style.display = 'none';
            if (RCV_LIVE) {
                document.querySelector('.bottom-bar').style.display = 'none';
                document.getElementById('rcvCounters').style.display = 'block';
            }
        }

        let scannedItems = [];
        let lastScannedCode = '';
        let lastScannedTime = 0;

        // კამერის მდგომარეობა
        let cameraStarted = false;
        let scanningActive = false;

        // ===== Multi-scan consensus =====
        // რამდენიმე ფრეიმის სკანირება და ყველაზე ხშირი შედეგის არჩევა
        const CONSENSUS_THRESHOLD = 2;  // 2-ჯერ ერთნაირი = დადასტურებული
        const CONSENSUS_WINDOW = 2000;  // 2 წამის ფანჯარა
        let scanBuffer = [];  // [{code, time}, ...]

        function addToBuffer(code) {
            const now = Date.now();
            // ძველი ჩანაწერების წაშლა (2 წამზე ძველი)
            scanBuffer = scanBuffer.filter(s => (now - s.time) < CONSENSUS_WINDOW);
            scanBuffer.push({ code: code, time: now });

            // რომელი კოდი ჩანს ყველაზე ხშირად?
            const counts = {};
            scanBuffer.forEach(s => {
                counts[s.code] = (counts[s.code] || 0) + 1;
            });

            let bestCode = null;
            let bestCount = 0;
            for (const [c, cnt] of Object.entries(counts)) {
                if (cnt > bestCount) {
                    bestCount = cnt;
                    bestCode = c;
                }
            }

            // Confidence ბარის განახლება
            const confBar = document.getElementById('confidenceBar');
            const overlay = document.getElementById('scanOverlay');
            if (bestCode && bestCount < CONSENSUS_THRESHOLD) {
                confBar.textContent = `🔍 ${bestCode} (${bestCount}/${CONSENSUS_THRESHOLD})`;
                if (overlay) overlay.classList.add('detecting');
            }

            if (bestCode && bestCount >= CONSENSUS_THRESHOLD) {
                // ✅ კონსენსუსი მიღწეულია!
                scanBuffer = [];
                confBar.textContent = '';
                if (overlay) overlay.classList.remove('detecting');
                return bestCode;
            }

            return null;  // ჯერ არ არის საკმარისი
        }

        // ===== Platform Detection =====
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

        // ===== Engine Detection =====
        // iOS Safari არ უჭერს მხარს BarcodeDetector API-ს — ყოველთვის html5-qrcode
        const useNative = ('BarcodeDetector' in window) && !isIOS;
        let nativeBarcodeDetector = null;
        let nativeStream = null;
        let nativeAnimFrame = null;
        let html5Qrcode = null;
        let torchOn = false;
        let torchSupported = false;
        let darkFrameCount = 0;          // auto-torch: ბნელი ფრეიმების მთვლელი
        let autoTorchTriggered = false;   // auto-torch: უკვე ჩაირთო?
        let h5EnhanceInterval = null;     // html5-qrcode enhanced scan loop

        if (useNative) {
            document.getElementById('engineBadge').textContent = '⚡ Native BarcodeDetector';
        } else {
            document.getElementById('engineBadge').textContent = '📦 html5-qrcode (ZXing)';
            html5Qrcode = new Html5Qrcode("reader");
        }

        const html5Config = {
            fps: isIOS ? 30 : 15,
            qrbox: isIOS ? { width: 320, height: 180 } : { width: 280, height: 150 },
            aspectRatio: 1.5,
            disableFlip: false,
            formatsToSupport: [
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.EAN_8,
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39,
                Html5QrcodeSupportedFormats.CODE_93,
                Html5QrcodeSupportedFormats.UPC_A,
                Html5QrcodeSupportedFormats.UPC_E,
                Html5QrcodeSupportedFormats.ITF,
                Html5QrcodeSupportedFormats.QR_CODE,
                Html5QrcodeSupportedFormats.DATA_MATRIX,
            ]
        };
        // iOS — videoConstraints კონფიგურაციაში, რეზოლუციის კონტროლისთვის
        if (isIOS) {
            html5Config.videoConstraints = {
                facingMode: "environment",
                width: { min: 640, ideal: 1280 },
                height: { min: 480, ideal: 720 }
            };
        }

        // ===== Native BarcodeDetector სკანირება =====
        async function startNativeCamera() {
            const scanBtn = document.getElementById('scanBtn');
            scanBtn.disabled = true;
            scanBtn.textContent = '⏳ კამერა იხსნება...';

            try {
                // BarcodeDetector ინიციალიზაცია
                nativeBarcodeDetector = new BarcodeDetector({
                    formats: ['ean_13', 'ean_8', 'code_128', 'code_39', 'code_93',
                              'upc_a', 'upc_e', 'itf', 'qr_code', 'data_matrix']
                });

                // კამერის გახსნა მაღალი რეზოლუციით + torch მხარდაჭერა
                const videoConstraints = {
                    facingMode: 'environment',
                    width: { ideal: 1920 },
                    height: { ideal: 1080 },
                };
                // iOS Safari არ უჭერს მხარს focusMode/exposureMode — გამოტოვება
                if (!isIOS) {
                    videoConstraints.focusMode = { ideal: 'continuous' };
                    videoConstraints.exposureMode = { ideal: 'continuous' };
                    videoConstraints.whiteBalanceMode = { ideal: 'continuous' };
                }
                nativeStream = await navigator.mediaDevices.getUserMedia({
                    video: videoConstraints
                });

                const video = document.getElementById('nativeVideo');
                video.srcObject = nativeStream;
                await video.play();

                // Zoom — პატარა ბარკოდების წასაკითხად (მუშაობს iPhone SE-ზე)
                try {
                    const zoomTrack = nativeStream.getVideoTracks()[0];
                    const caps = zoomTrack.getCapabilities ? zoomTrack.getCapabilities() : {};
                    if (caps.zoom) {
                        const targetZoom = Math.min(2.0, caps.zoom.max);
                        await zoomTrack.applyConstraints({ advanced: [{ zoom: targetZoom }] });
                    }
                } catch(e) { /* zoom not supported — OK */ }

                // Torch მხარდაჭერის შემოწმება
                checkTorchSupport(nativeStream);

                document.getElementById('nativeCamera').style.display = 'block';
                document.getElementById('reader').style.display = 'none';

                cameraStarted = true;
                scanningActive = true;
                scanBtn.disabled = false;
                scanBtn.textContent = '⏸ პაუზა';
                scanBtn.className = 'scan-btn scanning';

                // სკანირების ციკლის დაწყება
                nativeScanLoop();
            } catch (err) {
                scanBtn.disabled = false;
                scanBtn.textContent = '📸 სკანირება';
                scanBtn.className = 'scan-btn';
                document.getElementById('lastScan').textContent = '❌ კამერა: ' + err.message;
                setTimeout(() => {
                    document.getElementById('lastScan').textContent = '';
                }, 3000);
            }
        }

        // Enhancement სტრატეგიები — ყოველ frame-ზე მხოლოდ 1 ეშვება, როტაციით
        let _scanStrategy = 0;
        // ბნელზე brighten/binarize ხშირად, ნათელზე darken ხშირად
        const _STRATEGIES_DARK = ['brighten', 'binarize', 'crop', 'brighten', 'accumulate', 'binarize'];
        const _STRATEGIES_BRIGHT = ['darken', 'binarize', 'crop', 'darken', 'binarize', 'accumulate'];
        const _STRATEGIES_NORMAL = ['raw', 'binarize', 'crop', 'brighten', 'accumulate', 'darken'];
        let _lastAvgBrightness = 128;
        // Frame accumulation — ხელის კანკალის კომპენსაცია (2 ფრეიმის გაშუალება)
        let _prevFrame = null;

        // მხოლოდ მწვანე overlay მართკუთხედის შიგნით crop
        function cropToScanOverlay(video) {
            const videoEl = document.getElementById('nativeVideo');
            const overlayEl = document.getElementById('scanOverlay');
            if (!videoEl || !overlayEl) return null;

            const videoRect = videoEl.getBoundingClientRect();
            const overlayRect = overlayEl.getBoundingClientRect();
            const videoW = video.videoWidth;
            const videoH = video.videoHeight;
            const displayW = videoRect.width;
            const displayH = videoRect.height;
            if (!displayW || !displayH || !videoW || !videoH) return null;

            // object-fit: cover — video-ს კოეფიციენტები display-ის კოეფიციენტებთან
            const videoAspect = videoW / videoH;
            const displayAspect = displayW / displayH;
            let scaleX, offsetX, offsetY;
            if (videoAspect > displayAspect) {
                // ვიდეო განიერია — სიმაღლით ვასკეილებთ, გვერდები იჭრება
                const scale = videoH / displayH;
                scaleX = scale;
                offsetX = (videoW - displayW * scale) / 2;
                offsetY = 0;
            } else {
                // ვიდეო მაღალია — სიგანით ვასკეილებთ, ზედა/ქვედა იჭრება
                const scale = videoW / displayW;
                scaleX = scale;
                offsetX = 0;
                offsetY = (videoH - displayH * scale) / 2;
            }

            const relLeft = overlayRect.left - videoRect.left;
            const relTop  = overlayRect.top  - videoRect.top;
            const srcX = Math.max(0, relLeft * scaleX + offsetX);
            const srcY = Math.max(0, relTop  * scaleX + offsetY);
            const srcW = Math.min(videoW - srcX, overlayRect.width  * scaleX);
            const srcH = Math.min(videoH - srcY, overlayRect.height * scaleX);
            if (srcW <= 0 || srcH <= 0) return null;

            // upscale ≥ 640px სიგანე — პატარა barcodes-ისთვის
            const targetW = Math.max(640, Math.round(srcW));
            const targetH = Math.round(targetW * srcH / srcW);
            const canvas = document.createElement('canvas');
            canvas.width = targetW;
            canvas.height = targetH;
            canvas.getContext('2d').drawImage(video, srcX, srcY, srcW, srcH, 0, 0, targetW, targetH);
            return canvas;
        }

        async function nativeScanLoop() {
            if (!cameraStarted) return;

            const video = document.getElementById('nativeVideo');
            if (video.readyState < 2) {
                nativeAnimFrame = requestAnimationFrame(nativeScanLoop);
                return;
            }

            if (scanningActive && nativeBarcodeDetector) {
                try {
                    // მხოლოდ მწვანე overlay-ს შიგნით detect (კადრში სხვა barcodes-ის გამოსარიცხად)
                    const overlayCanvas = cropToScanOverlay(video);
                    let barcodes = overlayCanvas
                        ? await nativeBarcodeDetector.detect(overlayCanvas)
                        : await nativeBarcodeDetector.detect(video);

                    // თუ ვერ წაიკითხა — მიმდინარე სტრატეგიით ცდა (სიკაშკაშეზე ადაპტური)
                    if (barcodes.length === 0) {
                        const strategies = _lastAvgBrightness < 80 ? _STRATEGIES_DARK
                            : _lastAvgBrightness > 180 ? _STRATEGIES_BRIGHT
                            : _STRATEGIES_NORMAL;
                        const strategy = strategies[_scanStrategy % strategies.length];
                        _scanStrategy++;
                        let enhanced = null;
                        if (strategy === 'crop') {
                            enhanced = cropCenter(video, 1.5);
                        } else if (strategy === 'accumulate') {
                            enhanced = accumulateFrames(video);
                        } else if (strategy !== 'raw') {
                            enhanced = enhanceFrame(video, strategy);
                        }
                        if (enhanced) barcodes = await nativeBarcodeDetector.detect(enhanced);
                    }

                    for (const barcode of barcodes) {
                        if (barcode.rawValue) {
                            handleRawScan(barcode.rawValue);
                        }
                    }
                } catch (err) {
                    // იგნორი
                }
            }

            nativeAnimFrame = requestAnimationFrame(nativeScanLoop);
        }

        // ===== Image Enhancement Strategies =====

        // საშუალო სიკაშკაშის გამოთვლა
        function getAvgBrightness(data) {
            let total = 0, samples = 0;
            for (let i = 0; i < data.length; i += 80) {
                total += (data[i] + data[i+1] + data[i+2]) / 3;
                samples++;
            }
            const avg = total / samples;
            _lastAvgBrightness = avg;

            // Auto-torch: ბნელზე ჩართვა, გადანათებაზე გამორთვა
            if (avg < 50) {
                darkFrameCount++;
                if (darkFrameCount >= 20 && torchSupported && !torchOn && !autoTorchTriggered) {
                    autoTorchTriggered = true;
                    toggleTorch();
                }
            } else if (avg > 220 && torchOn && torchSupported) {
                // ფანარი გადანათებას იწვევს — გამორთვა
                toggleTorch();
                autoTorchTriggered = false;
            } else {
                darkFrameCount = Math.max(0, darkFrameCount - 1);
            }

            return avg;
        }

        // ფრეიმის canvas-ზე გადატანა
        function captureToCanvas(video) {
            const canvas = document.getElementById('nativeCanvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const w = video.videoWidth;
            const h = video.videoHeight;
            if (!w || !h) return null;
            canvas.width = w;
            canvas.height = h;
            ctx.drawImage(video, 0, 0, w, h);
            return { canvas, ctx, w, h };
        }

        // ცენტრიდან crop + upscale — პატარა ბარკოდების წასაკითხად
        function cropCenter(video, scale) {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const vw = video.videoWidth;
            const vh = video.videoHeight;
            if (!vw || !vh) return null;
            const cw = Math.floor(vw / scale);
            const ch = Math.floor(vh / scale);
            const sx = Math.floor((vw - cw) / 2);
            const sy = Math.floor((vh - ch) / 2);
            canvas.width = vw;
            canvas.height = vh;
            ctx.drawImage(video, sx, sy, cw, ch, 0, 0, vw, vh);
            return canvas;
        }

        // Frame accumulation — 2 ფრეიმის გაშუალება (კანკალის კომპენსაცია)
        function accumulateFrames(video) {
            try {
                const vw = video.videoWidth, vh = video.videoHeight;
                if (!vw || !vh) return null;
                const canvas = document.createElement('canvas');
                canvas.width = vw; canvas.height = vh;
                const ctx = canvas.getContext('2d', { willReadFrequently: true });
                ctx.drawImage(video, 0, 0, vw, vh);
                const curData = ctx.getImageData(0, 0, vw, vh);
                const cur = curData.data;

                if (_prevFrame && _prevFrame.length === cur.length) {
                    // გაშუალება + კონტრასტის გაზრდა
                    for (let i = 0; i < cur.length; i += 4) {
                        for (let c = 0; c < 3; c++) {
                            let avg = (cur[i+c] + _prevFrame[i+c]) >> 1;
                            // კონტრასტი — blur-ის კომპენსაცია
                            avg = ((avg - 128) * 1.3 + 128);
                            cur[i+c] = avg < 0 ? 0 : avg > 255 ? 255 : avg;
                        }
                    }
                    ctx.putImageData(curData, 0, 0);
                }
                // მიმდინარე ფრეიმი შევინახოთ
                _prevFrame = new Uint8ClampedArray(ctx.getImageData(0, 0, vw, vh).data);
                return canvas;
            } catch(e) { return null; }
        }

        function enhanceFrame(video, mode) {
            try {
                const cap = captureToCanvas(video);
                if (!cap) return null;
                const { canvas, ctx, w, h } = cap;
                const imageData = ctx.getImageData(0, 0, w, h);
                const data = imageData.data;
                const avgBright = getAvgBrightness(data);

                if (mode === 'brighten') {
                    if (avgBright > 120) return null;
                    const boost = Math.min(80, Math.max(20, 150 - avgBright));
                    const contrast = avgBright < 60 ? 2.0 : 1.5;
                    const mid = 128;
                    for (let i = 0; i < data.length; i += 4) {
                        for (let c = 0; c < 3; c++) {
                            let v = data[i + c];
                            v = (v - mid) * contrast + mid + boost;
                            data[i + c] = v < 0 ? 0 : v > 255 ? 255 : v;
                        }
                    }
                } else if (mode === 'darken') {
                    // ფანარით ზედმეტი სიკაშკაშის კომპენსაცია — აგრესიული
                    if (avgBright < 150) return null;
                    // რაც უფრო ნათელია, მით მეტი კომპენსაცია
                    const overexposure = avgBright - 130;
                    const dim = Math.min(100, overexposure);
                    const contrast = avgBright > 210 ? 3.0 : avgBright > 180 ? 2.5 : 2.0;
                    const mid = 128;
                    for (let i = 0; i < data.length; i += 4) {
                        for (let c = 0; c < 3; c++) {
                            let v = data[i + c];
                            v = (v - mid) * contrast + mid - dim;
                            data[i + c] = v < 0 ? 0 : v > 255 ? 255 : v;
                        }
                    }
                } else if (mode === 'binarize') {
                    // Grayscale → Otsu-ს მსგავსი ადაპტური threshold
                    // ჯერ grayscale
                    for (let i = 0; i < data.length; i += 4) {
                        const gray = data[i] * 0.299 + data[i+1] * 0.587 + data[i+2] * 0.114;
                        data[i] = data[i+1] = data[i+2] = gray;
                    }
                    // Histogram-ით threshold-ის გამოთვლა (Otsu)
                    const hist = new Uint32Array(256);
                    for (let i = 0; i < data.length; i += 4) hist[data[i]]++;
                    const totalPx = data.length / 4;
                    let sumAll = 0;
                    for (let t = 0; t < 256; t++) sumAll += t * hist[t];
                    let sumB = 0, wB = 0, maxVar = 0, threshold = 128;
                    for (let t = 0; t < 256; t++) {
                        wB += hist[t];
                        if (wB === 0) continue;
                        const wF = totalPx - wB;
                        if (wF === 0) break;
                        sumB += t * hist[t];
                        const mB = sumB / wB;
                        const mF = (sumAll - sumB) / wF;
                        const between = wB * wF * (mB - mF) * (mB - mF);
                        if (between > maxVar) { maxVar = between; threshold = t; }
                    }
                    // Binarize
                    for (let i = 0; i < data.length; i += 4) {
                        const v = data[i] > threshold ? 255 : 0;
                        data[i] = data[i+1] = data[i+2] = v;
                    }
                } else if (mode === 'sharpen') {
                    // Unsharp mask: sharpen kernel convolution
                    if (avgBright > 150) return null; // ნათელი სურათი — არ სჭირდება
                    const src = new Uint8ClampedArray(data);
                    // kernel: 0 -1.5 0 / -1.5 7 -1.5 / 0 -1.5 0
                    for (let y = 1; y < h - 1; y++) {
                        for (let x = 1; x < w - 1; x++) {
                            const idx = (y * w + x) * 4;
                            for (let c = 0; c < 3; c++) {
                                const v = 7 * src[idx + c]
                                    - 1.5 * src[((y-1)*w + x)*4 + c]
                                    - 1.5 * src[((y+1)*w + x)*4 + c]
                                    - 1.5 * src[(y*w + x-1)*4 + c]
                                    - 1.5 * src[(y*w + x+1)*4 + c];
                                data[idx + c] = v < 0 ? 0 : v > 255 ? 255 : v;
                            }
                        }
                    }
                }

                ctx.putImageData(imageData, 0, 0);
                return canvas;
            } catch (e) {
                return null;
            }
        }

        function stopNativeCamera() {
            if (nativeAnimFrame) {
                cancelAnimationFrame(nativeAnimFrame);
                nativeAnimFrame = null;
            }
            if (nativeStream) {
                nativeStream.getTracks().forEach(t => t.stop());
                nativeStream = null;
            }
            const video = document.getElementById('nativeVideo');
            if (video) video.srcObject = null;
            document.getElementById('nativeCamera').style.display = 'none';
            cameraStarted = false;
            scanningActive = false;
            torchOn = false;
            torchSupported = false;
            darkFrameCount = 0;
            autoTorchTriggered = false;
            document.getElementById('torchBtn').style.display = 'none';
            document.getElementById('torchBtn').classList.remove('active');
        }

        // ===== Torch (ფანარი) =====
        function checkTorchSupport(stream) {
            try {
                const track = stream.getVideoTracks()[0];
                if (!track) return;
                const caps = track.getCapabilities ? track.getCapabilities() : {};
                if (caps.torch) {
                    torchSupported = true;
                    document.getElementById('torchBtn').style.display = 'block';
                }
            } catch (e) {
                torchSupported = false;
            }
        }

        async function toggleTorch() {
            if (!torchSupported) return;
            const stream = nativeStream || (html5Qrcode && html5Qrcode.getRunningTrackSettings ? getHtml5Stream() : null);
            if (!stream) return;
            try {
                const track = stream.getVideoTracks()[0];
                if (!track) return;
                torchOn = !torchOn;
                await track.applyConstraints({ advanced: [{ torch: torchOn }] });
                const btn = document.getElementById('torchBtn');
                btn.classList.toggle('active', torchOn);
                btn.textContent = torchOn ? '🔦' : '🔦';
            } catch (e) {
                console.log('Torch error:', e);
            }
        }

        function getHtml5Stream() {
            // html5-qrcode ვიდეო ელემენტიდან stream-ის ამოღება
            try {
                const videoEl = document.querySelector('#reader video');
                if (videoEl && videoEl.srcObject) return videoEl.srcObject;
            } catch(e) {}
            return null;
        }

        // ===== html5-qrcode fallback =====
        function startHtml5Camera() {
            const scanBtn = document.getElementById('scanBtn');
            scanBtn.disabled = true;
            scanBtn.textContent = '⏳ კამერა იხსნება...';

            document.getElementById('nativeCamera').style.display = 'none';
            document.getElementById('reader').style.display = 'block';

            return html5Qrcode.start(
                { facingMode: "environment" },
                html5Config,
                onHtml5ScanSuccess,
                () => {} // failure იგნორი
            ).then(() => {
                cameraStarted = true;
                scanningActive = true;
                scanBtn.disabled = false;
                scanBtn.textContent = '⏸ პაუზა';
                scanBtn.className = 'scan-btn scanning';
                // Torch მხარდაჭერის შემოწმება html5-qrcode-სთვის
                const h5stream = getHtml5Stream();
                if (h5stream) {
                    checkTorchSupport(h5stream);
                    try {
                        const zt = h5stream.getVideoTracks()[0];
                        const zc = zt.getCapabilities ? zt.getCapabilities() : {};
                        if (zc.zoom) zt.applyConstraints({ advanced: [{ zoom: Math.min(2.0, zc.zoom.max) }] });
                    } catch(e) {}
                }
                // Enhanced scan loop — canvas + binarize
                startH5EnhancedScan();
            }).catch(err => {
                scanBtn.disabled = false;
                scanBtn.textContent = '📸 სკანირება';
                scanBtn.className = 'scan-btn';
                document.getElementById('lastScan').textContent = '❌ კამერა: ' + err;
                setTimeout(() => {
                    document.getElementById('lastScan').textContent = '';
                }, 3000);
            });
        }

        function onHtml5ScanSuccess(decodedText, decodedResult) {
            if (!scanningActive) return;
            handleRawScan(decodedText);
        }

        // ===== html5-qrcode enhanced scan — ყოველ 500ms canvas-based enhancement =====
        function startH5EnhancedScan() {
            if (h5EnhanceInterval) return;
            h5EnhanceInterval = setInterval(async () => {
                if (!scanningActive || !cameraStarted) return;
                try {
                    const videoEl = document.querySelector('#reader video');
                    if (!videoEl || videoEl.readyState < 2) return;

                    // Auto-torch ლოგიკა html5-qrcode-სთვისაც
                    const tmpCanvas = document.createElement('canvas');
                    const tmpCtx = tmpCanvas.getContext('2d', { willReadFrequently: true });
                    const vw = videoEl.videoWidth, vh = videoEl.videoHeight;
                    if (!vw || !vh) return;
                    tmpCanvas.width = vw;
                    tmpCanvas.height = vh;
                    tmpCtx.drawImage(videoEl, 0, 0, vw, vh);
                    const tmpData = tmpCtx.getImageData(0, 0, vw, vh).data;
                    getAvgBrightness(tmpData);

                    // Enhanced frame → html5Qrcode.scanFile
                    // Binarized version — ყველაზე ეფექტურია ბარკოდისთვის
                    const enhCanvas = document.createElement('canvas');
                    enhCanvas.width = vw;
                    enhCanvas.height = vh;
                    const enhCtx = enhCanvas.getContext('2d', { willReadFrequently: true });
                    enhCtx.drawImage(videoEl, 0, 0, vw, vh);
                    const imgData = enhCtx.getImageData(0, 0, vw, vh);
                    const d = imgData.data;

                    // ადაპტური binarize — სიკაშკაშის მიხედვით
                    // ჯერ საშუალო სიკაშკაშე
                    let graySum = 0;
                    for (let i = 0; i < d.length; i += 16) {
                        graySum += d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114;
                    }
                    const avgGray = graySum / (d.length / 16);
                    // ბნელ სურათზე — boost + დაბალი threshold; ნათელზე — dim + მაღალი threshold
                    const boostFactor = avgGray < 100 ? 1.4 : avgGray < 160 ? 1.0 : 0.7;
                    const boostOffset = avgGray < 100 ? 30 : avgGray < 160 ? 0 : -40;
                    const binThreshold = avgGray < 100 ? 130 : avgGray < 160 ? 140 : 120;
                    for (let i = 0; i < d.length; i += 4) {
                        let gray = d[i] * 0.299 + d[i+1] * 0.587 + d[i+2] * 0.114;
                        gray = Math.max(0, Math.min(255, gray * boostFactor + boostOffset));
                        d[i] = d[i+1] = d[i+2] = gray > binThreshold ? 255 : 0;
                    }
                    enhCtx.putImageData(imgData, 0, 0);

                    // Canvas → Blob → scan
                    enhCanvas.toBlob(async (blob) => {
                        if (!blob || !scanningActive) return;
                        try {
                            const file = new File([blob], 'frame.png', { type: 'image/png' });
                            const result = await html5Qrcode.scanFileV2(file, false);
                            if (result && result.decodedText) {
                                handleRawScan(result.decodedText);
                            }
                        } catch (e) {
                            // სკანირება ვერ მოხერხდა — ნორმალური
                        }
                    }, 'image/png');
                } catch (e) {
                    // იგნორი
                }
            }, isIOS ? 300 : 500);
        }

        function stopH5EnhancedScan() {
            if (h5EnhanceInterval) {
                clearInterval(h5EnhanceInterval);
                h5EnhanceInterval = null;
            }
        }

        // ===== საერთო სკანირების ლოგიკა (ორივე engine-სთვის) =====
        function signalScan() {
            // ვიბრაცია — Android
            if (navigator.vibrate) navigator.vibrate([50, 30, 50]);
            // Haptic — iOS/Android Telegram WebApp
            try {
                if (tg && tg.HapticFeedback) {
                    tg.HapticFeedback.impactOccurred('heavy');
                    setTimeout(() => {
                        try { tg.HapticFeedback.impactOccurred('heavy'); } catch(e2) {}
                    }, 100);
                    setTimeout(() => {
                        try { tg.HapticFeedback.notificationOccurred('success'); } catch(e3) {}
                    }, 200);
                }
            } catch(e) {}
            // AudioContext beep — უნივერსალური fallback
            try {
                const actx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = actx.createOscillator();
                const gain = actx.createGain();
                osc.connect(gain);
                gain.connect(actx.destination);
                osc.frequency.value = 1200;
                gain.gain.value = 0.3;
                osc.start();
                osc.stop(actx.currentTime + 0.12);
            } catch(e) {}
        }

        function handleRawScan(rawCode) {
            if (!scanningActive) return;
            if (RCV_MODE && rcvSending) return;
            if (!rawCode || rawCode.trim().length === 0) return;

            const cleaned = cleanCode(rawCode);
            if (!cleaned) return;

            // Multi-scan consensus — აკუმულირება
            const confirmed = addToBuffer(cleaned);
            if (!confirmed) return;  // ჯერ არ არის კონსენსუსი

            // ✅ კონსენსუსით დადასტურებული კოდი!
            const now = Date.now();
            // დუბლიკატის ფილტრი (იგივე კოდი 3 წამში)
            if (confirmed === lastScannedCode && (now - lastScannedTime) < 1500) {
                return;
            }
            lastScannedCode = confirmed;
            lastScannedTime = now;

            if (RCV_MODE) {
                // ჯერ ჩაწერა, მერე სიგნალი (სიგნალი = შენახულია)
                if (!addCode(confirmed)) {
                    lastScannedCode = '';
                    pauseScanning();
                    return;
                }
                signalScan();
            } else {
                signalScan();
                addCode(confirmed);
            }

            document.getElementById('lastScan').textContent = '✅ ' + confirmed;
            setTimeout(() => {
                document.getElementById('lastScan').textContent = '';
            }, 2000);

            // სკანირების შემდეგ პაუზა
            pauseScanning();
        }

        // ===== ღილაკის toggle =====
        function toggleScanner() {
            if (!cameraStarted) {
                if (useNative) {
                    return startNativeCamera();
                } else {
                    return startHtml5Camera();
                }
            } else if (scanningActive) {
                pauseScanning();
            } else {
                resumeScanning();
            }
        }

        // სკანირების პაუზა (კამერა რჩება აქტიური!)
        function pauseScanning() {
            scanningActive = false;
            scanBuffer = [];
            stopH5EnhancedScan();
            document.getElementById('confidenceBar').textContent = '';
            const overlay = document.getElementById('scanOverlay');
            if (overlay) overlay.classList.remove('detecting');
            const scanBtn = document.getElementById('scanBtn');
            scanBtn.textContent = '📸 სკანირება';
            scanBtn.className = 'scan-btn paused';
        }

        // სკანირების გაგრძელება (კამერა უკვე მუშაობს)
        function resumeScanning() {
            scanningActive = true;
            lastScannedCode = '';
            scanBuffer = [];
            document.getElementById('confidenceBar').textContent = '';
            const scanBtn = document.getElementById('scanBtn');
            scanBtn.textContent = '⏸ პაუზა';
            scanBtn.className = 'scan-btn scanning';
            // html5-qrcode-ის enhanced scan-ის გაგრძელება
            if (!useNative && cameraStarted) startH5EnhancedScan();
        }

        // კოდის გაწმენდა
        function cleanCode(code) {
            code = code.trim();
            if (!code) return '';
            // -00 სუფიქსი
            code = code.replace(/-00$/, '');
            // ტირეების მოშორება
            code = code.replace(/-/g, '');
            // CODE39 start/stop *
            code = code.replace(/^\*|\*$/g, '');
            // P პრეფიქსი
            if (code.length >= 5 && /^P[A-Z0-9]/i.test(code)) {
                const withoutP = code.substring(1);
                if (/\d/.test(withoutP)) {
                    code = withoutP;
                }
            }
            return code;
        }

        function rcvSaveFailed() {
            const statusMsg = document.getElementById('statusMsg');
            statusMsg.textContent = '⚠️ ტელეფონში ვერ შეინახა — სცადე ხელახლა';
            statusMsg.className = 'status-msg status-err';
        }

        // მიღების რეჟიმში: true = შენახულია
        function rcvSetControls(enabled) {
            const manual = document.getElementById('manualCode');
            manual.disabled = !enabled;
            if (manual.nextElementSibling) manual.nextElementSibling.disabled = !enabled;
            document.getElementById('scanBtn').disabled = !enabled;
        }

        function rcvSendEnd() {
            rcvSending = false;
            rcvSetControls(true);
        }

        function rcvAddRow(idx) {
            const row = rcvRows[idx];
            if (row) rcvAdd(row.code);
        }

        function rcvRemoveRow(idx) {
            const row = rcvRows[idx];
            if (!row || rcvSending || rcvClosed) return;
            try { outbox.removeOne(row.code); } catch (e) { rcvSaveFailed(); return; }
            document.getElementById('statusMsg').textContent = '';
            renderList();
            rcvSchedule();
        }

        function rcvAdd(code) {
            if (rcvSending || rcvClosed) return false;
            try {
                outbox.addScan(code);
            } catch (e) {
                rcvSaveFailed();
                return false;
            }
            document.getElementById('statusMsg').textContent = '';
            renderList();
            rcvSchedule();
            return true;
        }

        function rcvUndoLast() {
            if (rcvSending || rcvClosed) return;
            try { outbox.undoLast(); } catch (e) { rcvSaveFailed(); return; }
            renderList();
            rcvSchedule();
        }

        function addCode(rawCode) {
            const code = cleanCode(rawCode);
            if (!code) return false;
            if (RCV_MODE) return rcvAdd(code);

            const existingIdx = scannedItems.findIndex(item => item.code === code);
            if (existingIdx !== -1) {
                // რაოდენობა გაზარდე და სიის თავში გადაიტანე
                scannedItems[existingIdx].qty++;
                const item = scannedItems.splice(existingIdx, 1)[0];
                scannedItems.unshift(item);
            } else {
                scannedItems.unshift({ code: code, qty: 1 });
            }
            renderList();
            return true;
        }

        function addManualCode() {
            const input = document.getElementById('manualCode');
            const code = input.value.trim();
            if (code) {
                addCode(code);
                input.value = '';
            }
        }

        if (RCV_MODE) renderList();  // მიღებაში: შენახული სკანები გახსნისას მაშინვე ჩანს

        document.getElementById('manualCode').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                addManualCode();
            }
        });

        function changeQty(index, delta) {
            scannedItems[index].qty += delta;
            if (scannedItems[index].qty <= 0) {
                scannedItems.splice(index, 1);
            }
            renderList();
        }

        function removeItem(index) {
            scannedItems.splice(index, 1);
            renderList();
        }

        function renderList() {
            const listEl = document.getElementById('scanList');
            const sendBtn = document.getElementById('sendBtn');
            const totalBar = document.getElementById('totalBar');
            if (RCV_LIVE) return rcvRenderLive(listEl, totalBar);
            const listItems = RCV_MODE ? outbox.items() : scannedItems;
            if (RCV_MODE) rcvRows = listItems;

            if (listItems.length === 0) {
                listEl.innerHTML = '<div class="empty-msg">📸 დააჭირე სკანირებას ან ხელით შეიყვანე კოდი</div>';
                sendBtn.disabled = true;
                totalBar.textContent = '';
                return;
            }

            sendBtn.disabled = false;
            let html = '';
            let totalQty = 0;

            listItems.forEach((item, idx) => {
                totalQty += item.qty;
                if (RCV_MODE) {
                    html += `
                    <div class="scan-item">
                        <div class="code">${escapeHtml(item.code)}</div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="rcvRemoveRow(${idx})">−</button>
                            <span class="qty-num">${item.qty}</span>
                            <button class="qty-btn" onclick="rcvAddRow(${idx})">+</button>
                        </div>
                    </div>
                `;
                    return;
                }
                html += `
                    <div class="scan-item">
                        <div class="code">${escapeHtml(item.code)}</div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="changeQty(${idx}, -1)">−</button>
                            <span class="qty-num">${item.qty}</span>
                            <button class="qty-btn" onclick="changeQty(${idx}, +1)">+</button>
                        </div>
                        <button class="remove-btn" onclick="removeItem(${idx})">✕</button>
                    </div>
                `;
            });

            if (RCV_MODE) {
                html += '<button class="btn" style="width:100%;margin-top:10px" onclick="rcvUndoLast()">↩️ ბოლო სკანის გაუქმება</button>';
            }

            listEl.innerHTML = html;
            totalBar.textContent = `სულ: ${listItems.length} კოდი, ${totalQty} ცალი`;
        }

        function clearAll() {
            scannedItems = [];
            lastScannedCode = '';
            scanBuffer = [];
            renderList();
            document.getElementById('statusMsg').textContent = '';
            document.getElementById('confidenceBar').textContent = '';
        }

        function openBotLink(deepLink) {
            // Telegram Mini App-ში deep link-ის გახსნა
            try {
                if (window.Telegram && window.Telegram.WebApp) {
                    // Mini App API-ით deep link-ის გახსნა — დახურავს Mini App-ს და გახსნის ბოტის ჩატს
                    window.Telegram.WebApp.openTelegramLink(deepLink);
                } else {
                    // fallback — ბრაუზერში გახსნა
                    window.open(deepLink, '_blank');
                }
            } catch (e) {
                // თუ openTelegramLink ვერ მუშაობს — fallback
                window.location.href = deepLink;
            }
        }

        function sendData() {
            if (RCV_MODE ? outbox.legacyItems().length === 0 : scannedItems.length === 0) return;

            const statusMsg = document.getElementById('statusMsg');
            const sendBtn = document.getElementById('sendBtn');
            if (RCV_MODE) {
                rcvSending = true;
                rcvSetControls(false);
            }
            sendBtn.disabled = true;
            statusMsg.textContent = '⏳ იგზავნება...';
            statusMsg.className = 'status-msg';

            // სკანირება გავაჩეროთ
            scanningActive = false;
            scanBuffer = [];
            stopAllCameras();

            const payload = {
                op: opType || '',
                bid: buyerId || '0',
                items: (RCV_MODE ? outbox.legacyItems() : scannedItems).map(item => ({code: item.code, qty: item.qty}))
            };

            // Worker relay → deep link → ბოტში გადასვლა
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);

            fetch(WORKER_URL + '/scan', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload),
                signal: controller.signal
            })
            .then(r => {
                clearTimeout(timeoutId);
                if (!r.ok) throw new Error('HTTP ' + r.status);
                return r.json();
            })
            .then(result => {
                if (result.key) {
                    if (RCV_MODE) outbox.clearAll();  // მხოლოდ Worker-ის key-ის შემდეგ
                    const deepLink = 'https://t.me/' + BOT_NAME + '?start=SK_' + result.key;
                    statusMsg.textContent = '✅ მონაცემები შენახულია!';

                    // ცდა 1: openTelegramLink — იხურავს Mini App-ს და გახსნის ბოტს
                    let opened = false;
                    try {
                        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.openTelegramLink) {
                            window.Telegram.WebApp.openTelegramLink(deepLink);
                            opened = true;
                            // ზოგ ვერსიაზე Mini App არ იხურება — ხელით დავხუროთ
                            setTimeout(() => {
                                try { window.Telegram.WebApp.close(); } catch(e2) {}
                            }, 800);
                        }
                    } catch(e) {
                        console.log('openTelegramLink failed:', e);
                    }

                    // თუ openTelegramLink ვერ გახსნა — ვაჩვენოთ ღილაკი
                    if (!opened) {
                        statusMsg.innerHTML = '✅ შენახულია!<br><br>' +
                            '<a href="' + deepLink + '" style="display:inline-block;padding:16px 32px;' +
                            'background:#0088cc;color:#fff;border-radius:12px;text-decoration:none;' +
                            'font-size:17px;font-weight:700;">📨 გახსენი ბოტში</a><br><br>' +
                            '<span style="font-size:12px;color:#aaa;">დააჭირე ბოტში გადასასვლელად</span>';
                        statusMsg.className = 'status-msg';
                    }
                } else {
                    statusMsg.textContent = '❌ შეცდომა: ' + (result.error || 'unknown');
                    statusMsg.className = 'status-msg status-err';
                    sendBtn.disabled = false;
                    if (RCV_MODE) rcvSendEnd();
                }
            })
            .catch(err => {
                clearTimeout(timeoutId);
                const errMsg = err.name === 'AbortError' ? 'ტაიმაუტი — სცადე ხელახლა' : err.message;
                statusMsg.textContent = '❌ კავშირი: ' + errMsg;
                statusMsg.className = 'status-msg status-err';
                sendBtn.disabled = false;
                if (RCV_MODE) rcvSendEnd();
            });
        }

        function stopAllCameras() {
            stopH5EnhancedScan();
            if (useNative) {
                stopNativeCamera();
            } else if (html5Qrcode && cameraStarted) {
                html5Qrcode.stop().then(() => {
                    cameraStarted = false;
                    const scanBtn = document.getElementById('scanBtn');
                    scanBtn.textContent = '📸 სკანირება';
                    scanBtn.className = 'scan-btn';
                }).catch(() => {});
            }
            const scanBtn = document.getElementById('scanBtn');
            scanBtn.textContent = '📸 სკანირება';
            scanBtn.className = 'scan-btn';
            torchOn = false;
            torchSupported = false;
            darkFrameCount = 0;
            autoTorchTriggered = false;
            document.getElementById('torchBtn').style.display = 'none';
            document.getElementById('torchBtn').classList.remove('active');
        }

        // ===== მიღების რეჟიმი: ზარის / აპის გადართვის შემდეგ კამერა იყინება =====
        // სამი ტრიგერი (visibilitychange, ტრეკის ended/mute, გაყინული ვიდეო) → ერთი დამუშავება:
        // კამერა ჩერდება და სრულეკრანიანი „📷 კამერის ჩართვა". თავისით არასდროს ირთვება.
        // პაუზა („📸 სკანირება") ვიდეოს არ აჩერებს (ორივე ძრავზე კამერა რჩება ჩართული),
        // ამიტომ currentTime პაუზაზეც მიდის და watchdog არ ირთვება.
        if (RCV_MODE) {
            const RCV_FREEZE_MS = 3000;
            const overlayEl = document.getElementById('rcvResume');
            const countEl = document.getElementById('rcvResumeCount');
            const msgEl = document.getElementById('rcvResumeMsg');
            let rcvOverlayOn = false;
            let hiddenWithCamera = false;
            let wdVideo = null, wdTime = -1, wdSince = 0;
            let watchedTrack = null;

            function rcvShowResume(msg) {
                if (RCV_LIVE) {
                    // „შენახულია" = Worker-მა მიიღო; ტელეფონში დარჩენილი ცალკე ჩანს
                    let text = '';
                    try {
                        text = '✅ შენახულია: ' + rcvNum(outbox.savedCount(rcvStatus));
                        const m = outbox.pendingCount();
                        if (m > 0) text += ' · ჯერ არ გაიგზავნა: ' + m;
                    } catch (e) {}
                    countEl.textContent = text;
                } else {
                    let qty = 0;
                    try { outbox.items().forEach(i => { qty += i.qty; }); } catch (e) {}
                    countEl.textContent = '✅ დასკანერებული: ' + qty + ' ცალი (შენახულია)';
                }
                msgEl.textContent = msg || '';
                overlayEl.style.display = 'flex';
                rcvOverlayOn = true;
            }

            function rcvInterrupt() {
                if (rcvSending || rcvOverlayOn || !cameraStarted) return;
                stopAllCameras();
                wdVideo = null;
                watchedTrack = null;
                rcvShowResume('');
            }

            function rcvVideoEl() {
                return useNative ? document.getElementById('nativeVideo') : document.querySelector('#reader video');
            }

            function rcvWatchTrack() {
                const stream = useNative ? nativeStream : getHtml5Stream();
                const track = stream && stream.getVideoTracks()[0];
                if (!track || track === watchedTrack) return;
                watchedTrack = track;
                const onEnd = () => { if (track === watchedTrack) rcvInterrupt(); };
                track.addEventListener('ended', onEnd);
                track.addEventListener('mute', onEnd);
            }

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'hidden') {
                    hiddenWithCamera = cameraStarted;
                } else {
                    wdVideo = null;
                    if (hiddenWithCamera) rcvInterrupt();
                    hiddenWithCamera = false;
                }
            });

            setInterval(() => {
                if (!cameraStarted || rcvSending || rcvOverlayOn || document.visibilityState !== 'visible') {
                    wdVideo = null;
                    return;
                }
                const video = rcvVideoEl();
                if (!video) { wdVideo = null; return; }
                rcvWatchTrack();
                const now = Date.now();
                if (video !== wdVideo || video.currentTime !== wdTime) {
                    wdVideo = video;
                    wdTime = video.currentTime;
                    wdSince = now;
                } else if (now - wdSince >= RCV_FREEZE_MS) {
                    rcvInterrupt();
                }
            }, 1000);

            document.getElementById('rcvResumeBtn').addEventListener('click', async () => {
                msgEl.textContent = '';
                // html5-qrcode-ის stop() ასინქრონულია; ჩავრთოთ ახალი მხოლოდ მისი დასრულების შემდეგ
                for (let i = 0; i < 10 && cameraStarted; i++) {
                    await new Promise(r => setTimeout(r, 100));
                }
                cameraStarted = false;
                scanningActive = false;
                overlayEl.style.display = 'none';
                rcvOverlayOn = false;
                wdVideo = null;
                try { await toggleScanner(); } catch (e) {}
                if (!cameraStarted) {
                    rcvShowResume('დახურე და თავიდან გახსენი სკანერი — დასკანერებული შენახულია');
                }
            });
        }

        // ===== მიღება k-ით: სკანი მაშინვე Worker-ზე, ბოტის სტატუსი უკან =====
        // Cloudflare Free (R10): გაგზავნა ბოლო ცვლილებიდან ~2 წმ-ში (რამდენიმე სკანი — ერთ პაკეტად, მაქს. 8 წმ
        // პირველიდან), ჩავარდნისას 2→4→8→…→60 წმ; hb მხოლოდ გაუგზავნელის რიცხვის ცვლილებაზე; სტატუსი 15 წმ-ში.
        const RCV_DEBOUNCE_MS = 2000, RCV_MAX_WAIT_MS = 8000, RCV_BACKOFF_MAX_MS = 60000, RCV_POLL_MS = 15000;

        function rcvNum(x) {
            return String(Math.round(x * 1000) / 1000);
        }

        function rcvSchedule() {
            if (!RCV_LIVE || rcvClosed || rcvBackoff) return;  // ხელახალი ცდისას ჯერ inflight პაკეტი უნდა წავიდეს
            const now = Date.now();
            if (!rcvFirstChange) rcvFirstChange = now;
            const due = Math.min(now + RCV_DEBOUNCE_MS, rcvFirstChange + RCV_MAX_WAIT_MS);
            clearTimeout(rcvTimer);
            rcvTimer = setTimeout(rcvFlush, Math.max(0, due - now));
        }

        async function rcvFetch(url, opts) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);
            try {
                return await fetch(url, Object.assign({ signal: controller.signal }, opts));
            } finally {
                clearTimeout(timeoutId);
            }
        }

        async function rcvPost(pkt, keepalive) {
            try {
                // text/plain — „მარტივი" მოთხოვნა: CORS preflight არ სჭირდება (keepalive-ითაც)
                const r = await rcvFetch(WORKER_URL + '/rcv', {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
                    body: JSON.stringify(pkt),
                    keepalive: !!keepalive
                });
                if (!r.ok) return false;
                const j = await r.json();
                return !!(j && j.ok === true);
            } catch (e) {
                return false;
            }
        }

        // რიგი ბოლომდე: nextPacket (იგივე cid/მოვლენები, ახალი init_data) → POST → ack. → true | false (ჩავარდა)
        async function rcvDrain(ob, keepalive) {
            for (;;) {
                if (ob === outbox && rcvClosed) return true;
                let pkt;
                try { pkt = ob.nextPacket(tg.initData || ''); } catch (e) { return false; }
                if (!pkt) return true;
                if (!(await rcvPost(pkt, keepalive))) return false;
                try { ob.ack(pkt.cid); } catch (e) { return false; }  // ჩაწერა ჩავარდა → იგივე cid ხელახლა
            }
        }

        async function rcvFlush(keepalive) {
            clearTimeout(rcvTimer);
            rcvTimer = null;
            if (!RCV_LIVE || rcvClosed || rcvFlushing) return;
            rcvFlushing = true;
            rcvFirstChange = 0;
            let ok = false;
            try {
                ok = await rcvDrain(outbox, keepalive === true);
            } finally {
                rcvFlushing = false;
            }
            if (ok) {
                rcvBackoff = 0;
            } else if (!rcvClosed) {
                rcvBackoff = Math.min(RCV_BACKOFF_MAX_MS, rcvBackoff ? rcvBackoff * 2 : RCV_DEBOUNCE_MS);
                rcvTimer = setTimeout(rcvFlush, rcvBackoff);
            }
            await rcvHeartbeat();
            renderList();
        }

        // გაუგზავნელის რიცხვი Worker-ზე (ბოტის „დასრულების" გაფრთხილებისთვის) — მხოლოდ ცვლილებისას
        async function rcvHeartbeat() {
            if (rcvClosed) return;
            let n = null;
            try { n = outbox.hbDue(); } catch (e) { return; }
            if (n === null) return;
            try {
                const r = await rcvFetch(WORKER_URL + '/rcv/hb/' + encodeURIComponent(RID) + '/' + encodeURIComponent(RCV_UID), {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ k: RCV_K, pending: n, ts: Date.now() })
                });
                if (r.ok) outbox.hbSent(n);
            } catch (e) { /* შემდეგ ჯერზე */ }
        }

        async function rcvPollStatus() {
            if (!RCV_LIVE || rcvClosed || rcvPolling || document.visibilityState !== 'visible') return;
            rcvPolling = true;
            try {
                const r = await rcvFetch(WORKER_URL + '/rcv/status/' + encodeURIComponent(RID) + '/' +
                    encodeURIComponent(RCV_UID) + '?k=' + encodeURIComponent(RCV_K), { cache: 'no-store' });
                if (r.ok) rcvApplyStatus(await r.json());  // 404 — ბოტს ჯერ არაფერი დაუთვლია
            } catch (e) {
                // შემდეგ ჯერზე
            } finally {
                rcvPolling = false;
            }
            await rcvHeartbeat();
            renderList();
        }

        function rcvApplyStatus(st) {
            if (!st || typeof st !== 'object') return;
            try { outbox.reconcile(Array.isArray(st.done_cids) ? st.done_cids : []); } catch (e) { /* შემდეგ სტატუსზე */ }
            rcvStatus = st;
            if (st.open === false) rcvClose();
        }

        // მიღება დახურულია: გაგზავნა, სტატუსი და სკანირება ჩერდება; ტელეფონის მონაცემები რჩება
        function rcvClose() {
            if (rcvClosed) return;
            rcvClosed = true;
            clearTimeout(rcvTimer);
            clearInterval(rcvPollTimer);
            scanningActive = false;
            stopAllCameras();
            rcvSetControls(false);
            document.getElementById('rcvResume').style.display = 'none';
            renderList();
        }

        // სხვა მიღებების დარჩენილი (ამ მომხმარებლის, შენახული k-ით) — ბოტი წყვეტს (ღიაა / ობოლია)
        async function rcvFlushStale() {
            let rids = [];
            try { rids = RcvOutbox.staleRids(window.localStorage, RCV_UID, RID); } catch (e) { return; }
            for (const rid of rids) {
                let ob;
                try {
                    ob = RcvOutbox.open({ storage: window.localStorage, rid: rid, uid: RCV_UID, now: Date.now, rand: rcvRand });
                } catch (e) { continue; }
                if (!(await rcvDrain(ob, false))) return;  // კავშირი არ არის — შემდეგ გახსნაზე
            }
        }

        function rcvRenderLive(listEl, totalBar) {
            const rows = outbox.rows();
            rcvRows = rows;
            const pending = outbox.pendingCount();
            let top = '<div class="rcv-saved">შენახულია: ' + rcvNum(outbox.savedCount(rcvStatus)) + '</div>';
            if (pending > 0) top += '<div class="rcv-unsent">ჯერ არ გაიგზავნა: ' + pending + ' — ინტერნეტს ელოდება</div>';
            if (rcvClosed) top += '<div class="rcv-closed">მიღება დახურულია — სკანირება აქ აღარ ითვლება</div>';
            document.getElementById('rcvCounters').innerHTML = top;
            totalBar.textContent = '';

            // „ჩემი ჯამი" — მხოლოდ ბოტის დათვლილი, ამ თანამშრომლის საკუთარი (ზედნადების რიცხვები აქ არ არის)
            const codes = rcvStatus && rcvStatus.codes && typeof rcvStatus.codes === 'object' ? rcvStatus.codes : {};
            const totals = Object.keys(codes).filter(c => Number(codes[c]) > 0).sort();
            if (!rows.length && !totals.length) {
                listEl.innerHTML = '<div class="empty-msg">📸 დააჭირე სკანირებას ან ხელით შეიყვანე კოდი</div>';
                return;
            }
            const MARK = { counted: '✓', saved: '☁️', local: '⏳' };
            let html = '';
            if (rows.length) {
                html += '<div class="rcv-h">ჩემი ბოლო სკანები</div>';
                rows.forEach((item, idx) => {
                    const controls = rcvClosed
                        ? `<span class="qty-num">${item.qty}</span>`
                        : `<div class="qty-controls">
                            <button class="qty-btn" onclick="rcvRemoveRow(${idx})">−</button>
                            <span class="qty-num">${item.qty}</span>
                            <button class="qty-btn" onclick="rcvAddRow(${idx})">+</button>
                        </div>`;
                    html += `
                    <div class="scan-item">
                        <span class="rcv-mark">${MARK[item.state] || ''}</span>
                        <div class="code">${escapeHtml(item.code)}</div>
                        ${controls}
                    </div>
                `;
                });
                if (!rcvClosed) {
                    html += '<button class="btn" style="width:100%;margin-top:10px" onclick="rcvUndoLast()">↩️ ბოლო სკანის გაუქმება</button>';
                }
            }
            if (totals.length) {
                html += '<div class="rcv-h">ჩემი ჯამი</div>';
                totals.forEach(c => {
                    html += '<div class="rcv-total"><span>' + escapeHtml(c) + '</span><b>' + rcvNum(Number(codes[c])) + '</b></div>';
                });
            }
            listEl.innerHTML = html;
        }

        if (RCV_LIVE) {
            document.addEventListener('visibilitychange', () => {
                if (rcvClosed) return;
                if (document.visibilityState === 'hidden') {
                    rcvFlush(true);  // ეკრანიდან გასვლა — ბოლო შანსი (keepalive)
                } else {
                    rcvPollStatus();
                    rcvFlush();
                }
            });
            window.addEventListener('online', () => { rcvFlush(); });
            rcvPollTimer = setInterval(rcvPollStatus, RCV_POLL_MS);
            // გახსნისას: ჯერ რიგი, მერე ბოტის სტატუსი („სად გავჩერდი"), მერე სხვა მიღებების დარჩენილი
            (async () => {
                await rcvFlush();
                await rcvPollStatus();
                await rcvFlushStale();
            })();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Back ღილაკი
        tg.BackButton.show();
        tg.BackButton.onClick(() => {
            stopAllCameras();
            tg.close();
        });
    </script>
</body>
</html>
